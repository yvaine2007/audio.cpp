name: Build and Push audio.cpp-vulkan-cuda12-sm6.0 Docker Images to Aliyun ACR
on:
  push:
    branches: [ "main", "master" ]
    tags: [ 'v*' ]
  workflow_dispatch:

env:
  REGISTRY: crpi-vdo6prrgwt5ktpy8.cn-hangzhou.personal.cr.aliyuncs.com
  NAMESPACE: catcat-nas
  IMAGE_NAME: audio.cpp
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Intel Iris Xe 版本 (Vulkan)
          - backend: vulkan
            dockerfile: .devops/vulkan.Dockerfile
            tag_suffix: vulkan-iris-xe
            build_args: ""
            
          # Tesla P100 版本 (CUDA 12, 指定 Pascal 6.0 架构)
          - backend: cuda12
            dockerfile: .devops/cuda.Dockerfile
            tag_suffix: cuda12-p100
            build_args: |
              CUDA_DOCKER_ARCH=60-real

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Aliyun Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ matrix.tag_suffix }}
            type=raw,value=${{ matrix.tag_suffix }}-${{ github.sha }}
            type=ref,event=tag,suffix=-${{ matrix.tag_suffix }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build_args }}
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
